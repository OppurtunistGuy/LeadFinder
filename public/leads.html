<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leads - Client Finder</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="top">
    <div class="brand">Client Finder</div>
    <nav class="nav" aria-label="Pages">
      <a href="/">Research</a>
      <a href="/leads.html" aria-current="page">Leads</a>
    </nav>
    <div class="phase">Check, score and list</div>
  </header>

  <main class="leads-layout">
    <form id="form" class="card search">
      <label for="niche">Check brands in which niche?</label>
      <div class="row">
        <select id="niche" aria-label="Niche"></select>
        <select id="country" aria-label="Country"></select>
        <button id="go" type="submit">Check brands</button>
      </div>
      <p id="hint" class="hint"></p>
      <p id="msg" class="notice" role="status" hidden></p>
      <p id="error" class="error" role="alert" hidden></p>
    </form>

    <div class="list-head">
      <h2 id="count">Leads</h2>
      <select id="filter" aria-label="Filter by status"></select>
    </div>
    <div id="list" class="lead-list"></div>
    <p id="empty" class="muted center">No leads yet. Pick a niche above and press <b>Check brands</b>.</p>
  </main>

  <script src="/common.js"></script>
  <script src="/leads.js"></script>
</body>
</html>
